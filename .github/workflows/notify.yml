name: Delivery notifications

# Calls the app's notifier so approaching deliveries reach the team's phones.
#
# Exists because Vercel's Hobby plan runs cron jobs only once a day, which is
# useless for a 2-hour urgency window. GitHub Actions gives a real cadence at
# no cost. The endpoint is idempotent — each (order, level) notifies once — so
# calling it often is safe and a missed run simply catches up on the next one.

# DISABLED as a schedule. Supabase pg_cron now drives the notifier from the
# database (supabase/migrations/*_schedule_delivery_notifications.sql), and two
# schedulers calling the same endpoint is pure duplication — the endpoint is
# idempotent, so nothing broke, it was just twice the traffic and twice the
# noise when one of them failed.
#
# Kept rather than deleted because it is the fallback if pg_cron or pg_net is
# ever unavailable: restore the block below and disable the database job with
# `select cron.unschedule('delivery-notifications');`.
#
#  schedule:
#    # Every 15 minutes, 05:00–20:00 UTC — roughly 06:00–22:00 in Zurich all
#    # year, so a late-evening deadline still alerts while the scheduler stays
#    # quiet overnight.
#    - cron: '*/15 5-20 * * *'
on:
  # Manual only. Still useful for testing the endpoint by hand from the
  # Actions tab without touching the database schedule.
  workflow_dispatch:

# Never run two at once: a slow run overlapping the next would be harmless
# (the claim is taken before sending) but there is no reason to allow it.
concurrency:
  group: delivery-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # A stuck request should not hold a runner for six hours.
    timeout-minutes: 5
    steps:
      - name: Call the notifier
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          # Strip any trailing slash so the URL never doubles up.
          url="${APP_URL%/}/api/cron/notify"
          echo "Calling ${url}"

          # --fail-with-body so a non-2xx is a failed run AND the reason is
          # printed, rather than a bare exit code.
          # Retries cover a cold serverless start or a brief network blip.
          response=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${url}")

          echo "Response: ${response}"

          # Surface the outcome in the run summary so the Actions list is
          # readable without opening each run.
          {
            echo "### Delivery notifications"
            echo ''
            echo '```json'
            echo "${response}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
